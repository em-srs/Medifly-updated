server.port=5000
spring.application.name=medifly-backend

# Supabase PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.qqhpexspcabuaxirxrqa.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ilovemybchi}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Disabled in Production)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JWT Security
jwt.secret=supersecretjwtkey_for_medifly_must_be_at_least_256_bits_long_for_hs256_algorithm
jwt.expiration.ms=604800000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.medifly=DEBUG
